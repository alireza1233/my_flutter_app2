name: Download Android SDK 34 (Platform + Build-Tools)

on:
  workflow_dispatch:  # اجرای دستی

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # برای آپلود در Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Android Command Line Tools
        shell: pwsh
        run: |
          $toolsZip = "commandlinetools-win-latest.zip"
          $url = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"
          Invoke-WebRequest -Uri $url -OutFile $toolsZip
          Expand-Archive -Path $toolsZip -DestinationPath "cmdline-tools-temp"
          New-Item -ItemType Directory -Path "$env:USERPROFILE\android-sdk\cmdline-tools\latest" -Force
          Move-Item -Path "cmdline-tools-temp\cmdline-tools\*" -Destination "$env:USERPROFILE\android-sdk\cmdline-tools\latest" -Force
          Remove-Item $toolsZip
          Remove-Item "cmdline-tools-temp" -Recurse -Force

      - name: Set environment variables
        shell: pwsh
        run: |
          echo "ANDROID_HOME=$env:USERPROFILE\android-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ANDROID_SDK_ROOT=$env:USERPROFILE\android-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Accept Android licenses
        shell: pwsh
        run: |
          $sdkmanager = "$env:USERPROFILE\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          for ($i=0; $i -lt 10; $i++) { echo y | & $sdkmanager --licenses }

      - name: Install Platform 34 and Build-Tools 34.0.0
        shell: pwsh
        run: |
          $sdkmanager = "$env:USERPROFILE\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Archive SDK folders
        shell: pwsh
        run: |
          $sourcePlatform = "$env:USERPROFILE\android-sdk\platforms\android-34"
          $sourceBuildTools = "$env:USERPROFILE\android-sdk\build-tools\34.0.0"
          $tempDir = "$env:TEMP\sdk-34-archive"
          New-Item -ItemType Directory -Path $tempDir -Force
          Copy-Item -Path $sourcePlatform -Destination "$tempDir\platforms\android-34" -Recurse -Force
          Copy-Item -Path $sourceBuildTools -Destination "$tempDir\build-tools\34.0.0" -Recurse -Force
          Compress-Archive -Path "$tempDir\*" -DestinationPath "android-sdk-34.zip" -CompressionLevel Optimal
          Remove-Item $tempDir -Recurse -Force

      - name: Get current date for release tag
        id: date
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "TAG=sdk-34-$date" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: "Android SDK 34 (Platform + Build-Tools) ${{ env.TAG }}"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./android-sdk-34.zip
          asset_name: android-sdk-34.zip
          asset_content_type: application/zip

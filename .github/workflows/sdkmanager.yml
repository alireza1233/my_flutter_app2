name: Download Android SDK 34 (Platform + Build-Tools)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Command Line Tools
        shell: pwsh
        run: |
          $url = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"
          $zip = "cmdline-tools.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "cmdline-temp"
          New-Item -ItemType Directory -Path "$env:USERPROFILE\android-sdk\cmdline-tools\latest" -Force
          Move-Item -Path "cmdline-temp\cmdline-tools\*" -Destination "$env:USERPROFILE\android-sdk\cmdline-tools\latest" -Force
          Remove-Item $zip, "cmdline-temp" -Recurse -Force

      - name: Set ANDROID_HOME
        shell: pwsh
        run: |
          echo "ANDROID_HOME=$env:USERPROFILE\android-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ANDROID_SDK_ROOT=$env:USERPROFILE\android-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Accept licenses (using cmd loop)
        shell: cmd
        run: |
          set ANDROID_HOME=%USERPROFILE%\android-sdk
          set ANDROID_SDK_ROOT=%ANDROID_HOME%
          (for /l %i in (1,1,15) do @echo y) | %USERPROFILE%\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat --licenses

      - name: Install Platform 34 and Build-Tools 34.0.0
        shell: pwsh
        run: |
          $sdkmanager = "$env:USERPROFILE\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdkmanager --verbose "platforms;android-34" "build-tools;34.0.0"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "sdkmanager failed with exit code $LASTEXITCODE"
            exit 1
          }
          $platformDir = "$env:USERPROFILE\android-sdk\platforms\android-34"
          $btDir = "$env:USERPROFILE\android-sdk\build-tools\34.0.0"
          if (-not (Test-Path $platformDir)) { throw "Platform directory not created" }
          if (-not (Test-Path $btDir)) { throw "Build-tools directory not created" }
          Write-Host "Installation successful"

      - name: Archive SDK folders
        shell: pwsh
        run: |
          $platformDir = "$env:USERPROFILE\android-sdk\platforms\android-34"
          $btDir = "$env:USERPROFILE\android-sdk\build-tools\34.0.0"
          $tempDir = "$env:TEMP\sdk-34-archive"
          New-Item -ItemType Directory -Path $tempDir -Force
          Copy-Item -Path $platformDir -Destination "$tempDir\platforms\android-34" -Recurse -Force
          Copy-Item -Path $btDir -Destination "$tempDir\build-tools\34.0.0" -Recurse -Force
          Compress-Archive -Path "$tempDir\*" -DestinationPath "android-sdk-34.zip" -CompressionLevel Optimal
          Remove-Item $tempDir -Recurse -Force

      - name: Get date for tag
        id: date
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "TAG=sdk-34-$date" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: "Android SDK 34 (Platform + Build-Tools) ${{ env.TAG }}"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./android-sdk-34.zip
          asset_name: android-sdk-34.zip
          asset_content_type: application/zip

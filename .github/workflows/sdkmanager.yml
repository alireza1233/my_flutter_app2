name: Download All Android SDK Platforms (30-35) + Build Tools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Command Line Tools
        shell: pwsh
        run: |
          $url = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"
          $zip = "cmdline-tools.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "cmdline-temp"
          New-Item -ItemType Directory -Path "$env:USERPROFILE\android-sdk\cmdline-tools\latest" -Force
          Move-Item -Path "cmdline-temp\cmdline-tools\*" -Destination "$env:USERPROFILE\android-sdk\cmdline-tools\latest" -Force
          Remove-Item $zip, "cmdline-temp" -Recurse -Force

      - name: Set ANDROID_HOME
        shell: pwsh
        run: |
          echo "ANDROID_HOME=$env:USERPROFILE\android-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ANDROID_SDK_ROOT=$env:USERPROFILE\android-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Accept all licenses
        shell: pwsh
        run: |
          $sdkmanager = "$env:USERPROFILE\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $sdkmanager --licenses 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Warning "Licenses acceptance may have issues, continuing anyway" }

      - name: Install all platforms and build-tools
        shell: pwsh
        run: |
          $sdkmanager = "$env:USERPROFILE\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          
          # لیست پلتفرم‌های مورد نیاز (از 30 تا 35)
          $platforms = @(
            "platforms;android-30",
            "platforms;android-31",
            "platforms;android-32",
            "platforms;android-33",
            "platforms;android-34",
            "platforms;android-35"
          )
          
          # لیست build-tools مربوط به هر نسخه
          $buildTools = @(
            "build-tools;30.0.3",
            "build-tools;31.0.0",
            "build-tools;32.0.0",
            "build-tools;33.0.0",
            "build-tools;34.0.0",
            "build-tools;35.0.0"
          )
          
          # نصب همه
          $allPackages = $platforms + $buildTools
          foreach ($pkg in $allPackages) {
            Write-Host "Installing $pkg ..."
            & $sdkmanager --verbose $pkg
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to install $pkg"
              exit 1
            }
          }
          
          Write-Host "All platforms and build-tools installed successfully."

      - name: Archive all SDK folders
        shell: pwsh
        run: |
          $sdkRoot = "$env:USERPROFILE\android-sdk"
          $platformsDir = "$sdkRoot\platforms"
          $buildToolsDir = "$sdkRoot\build-tools"
          $tempDir = "$env:TEMP\all-sdk-archive"
          New-Item -ItemType Directory -Path $tempDir -Force
          
          # کопиране на platforms
          Copy-Item -Path $platformsDir -Destination "$tempDir\platforms" -Recurse -Force
          # کопиране на build-tools
          Copy-Item -Path $buildToolsDir -Destination "$tempDir\build-tools" -Recurse -Force
          
          Compress-Archive -Path "$tempDir\*" -DestinationPath "android-sdk-all-platforms.zip" -CompressionLevel Optimal
          Remove-Item $tempDir -Recurse -Force

      - name: Get date for tag
        id: date
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "TAG=all-platforms-$date" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: "Android SDK All Platforms (30-35) + Build Tools ${{ env.TAG }}"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./android-sdk-all-platforms.zip
          asset_name: android-sdk-all-platforms.zip
          asset_content_type: application/zip
